# M13 (D8) — the isolated stack for the golden-path e2e test. Run with
# `pnpm e2e:stack` (see scripts/stack-e2e.sh), which passes
# `-p splitlab-e2e` so this gets its own containers, volumes, AND network —
# entirely separate from the dev stack in docker-compose.yml.
#
# Deliberately a SEPARATE, self-contained file rather than an override
# layered on top of docker-compose.yml with `-f docker-compose.yml -f
# docker-compose.e2e.yml`: Compose's merge rules treat list-valued keys like
# `ports` as ADDITIVE across files, not replaced — an override here setting
# `ports: []` would NOT clear the dev stack's published ports, defeating the
# entire point (D8: this stack must publish nothing, so it can run
# concurrently with the dev stack with zero collisions). Duplicating the
# infra service definitions without their `ports:` keys is the safe,
# unambiguous way to guarantee that. `web` isn't included — the golden path
# only exercises apps/api's HTTP surface.
#
# Trade-off worth naming: `postgres`/`rabbitmq`/`elasticsearch`/`migrate`/
# `reindex`/`api`/`event-processor` below are near-duplicates of the same
# services in docker-compose.yml (env vars, healthchecks, depends_on — only
# `ports:` differs). A change to one file's `environment:` block needs the
# same change here to stay accurate — keep them in sync by hand; there's no
# automatic guard against drift.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitlab
      POSTGRES_PASSWORD: splitlab
      POSTGRES_DB: splitlab
    volumes:
      # Same script the dev stack uses (docker-compose.yml) — this is a
      # brand-new Postgres container with its own volume, so it needs the
      # uuid-ossp extension enabled the same way (see that file's comment
      # on why: uuid_generate_v4() isn't created by any migration).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitlab -d splitlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: splitlab
      RABBITMQ_DEFAULT_PASS: splitlab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.5.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tooling
    command: pnpm run migration:run
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: splitlab
      DB_PASSWORD: splitlab
      DB_NAME: splitlab
    depends_on:
      postgres:
        condition: service_healthy

  # See docker-compose.yml's `reindex` for the full reasoning — mirrored
  # here so `api`'s search endpoint works against this stack too, not just
  # the dev one.
  reindex:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tooling
    command: pnpm run search:reindex
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: splitlab
      DB_PASSWORD: splitlab
      DB_NAME: splitlab
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: splitlab
    depends_on:
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: splitlab
      DB_PASSWORD: splitlab
      DB_NAME: splitlab
      RABBITMQ_URL: amqp://splitlab:splitlab@rabbitmq:5672
      RABBITMQ_QUEUE: events
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: splitlab
      RESULTS_WEBHOOK_URL: https://example.invalid/webhook   # RFC 2606-reserved — never resolves
      RESULTS_WEBHOOK_SECRET: dev-secret
      RESULTS_WEBHOOK_TIMEOUT_MS: "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      reindex:
        condition: service_completed_successfully
      event-processor:
        condition: service_healthy

  event-processor:
    build:
      context: .
      dockerfile: apps/event-processor/Dockerfile
      target: runtime
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: splitlab
      DB_PASSWORD: splitlab
      DB_NAME: splitlab
      RABBITMQ_URL: amqp://splitlab:splitlab@rabbitmq:5672
      RABBITMQ_QUEUE: events
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Not part of `up`'s default set of long-running services in spirit — it's
  # invoked with `docker compose run --rm stack-e2e` (scripts/stack-e2e.sh),
  # same "one-shot job" shape as `migrate`. Talks to the other services by
  # name over the compose network (STACK_BASE_URL=http://api:3000), never
  # localhost.
  stack-e2e:
    build:
      context: .
      dockerfile: tests/stack-e2e/Dockerfile
    environment:
      STACK_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
      event-processor:
        condition: service_healthy
