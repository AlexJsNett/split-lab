services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitlab
      POSTGRES_PASSWORD: splitlab
      POSTGRES_DB: splitlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: splitlab
      RABBITMQ_DEFAULT_PASS: splitlab
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq   # durable queues survive a broker restart

  elasticsearch:
    image: elasticsearch:9.5.1   # Docker Hub publishes no floating :9/:9.5 tag, exact pin required
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"    # dev only — plain http://, no auth/TLS
      xpack.ml.enabled: "false"          # unused, costs memory
      ES_JAVA_OPTS: -Xms512m -Xmx512m    # default heap is 50% of container RAM — cap it
    ports:
      - "9200:9200"     # REST API
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  rabbitmq-data:
  elasticsearch-data:
