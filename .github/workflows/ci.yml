name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `nx affected` to diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ github.job }}-

      # run-many covers `push` to main; affected (against origin/main) narrows PR runs to
      # only what changed. Targets that a project doesn't define are skipped, not failed.
      - name: Lint, typecheck, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint typecheck test build --base=origin/${{ github.base_ref }}
          else
            npx nx run-many -t lint typecheck test build
          fi
