name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref cancels whatever's still running for the previous
# one — free-tier minutes aren't worth spending on a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs below even need to start. This is where the real cost
  # lives — checkout, Node setup, and a full `pnpm install` of the whole
  # workspace all happen *after* this, so skipping a job here skips paying
  # for any of that. Deliberately NOT a workflow-level `on: paths:` filter —
  # a job/workflow skipped that way reports nothing at all (not even
  # "skipped"), which would leave `ci-ok` (and `deploy`, which depends on
  # it) waiting forever on a check that never resolves. Gating individual
  # jobs with `if:` instead means a skipped job reports "skipped", a real
  # conclusion `ci-ok` can read.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dorny/paths-filter needs history to diff against, same reason as V2's turbo filter

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            backend:
              - 'apps/api/**'
              - 'apps/event-processor/**'
              - 'packages/events-contract/**'
              - 'docker/**'
              - 'docker-compose*.yml'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/**'

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for turbo's --filter=...[base] to diff against the base branch

      - uses: pnpm/action-setup@v4 # reads the pinned version from package.json's packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Informational for now, not blocking: known findings are deliberately accepted (multer —
      # unused feature, fix is a breaking major bump; the rest are dev-tooling-only transitive
      # deps — eslint/jest/@nestjs/cli's minimatch chains, drizzle-kit's esbuild — never in the
      # production build). See security.md's A06 section for the full breakdown. Make this a
      # hard gate (drop continue-on-error) once multer is resolved or a real allowlist
      # mechanism is in place.
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

      # Full run on push to main; PRs narrow to backend packages affected since the base branch.
      # A task a package doesn't define is skipped, not failed. events-contract isn't listed
      # explicitly — turbo.json's dependsOn: ["^build"] pulls it in automatically as a build
      # dependency of api/event-processor regardless of the filter.
      - name: Lint, typecheck, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint typecheck test build \
              --filter="@split-lab/api...[origin/${{ github.base_ref }}]" \
              --filter="@split-lab/event-processor...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run lint typecheck test build \
              --filter=@split-lab/api \
              --filter=@split-lab/event-processor
          fi

  web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

      - name: Lint, typecheck, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint typecheck build --filter="web...[origin/${{ github.base_ref }}]"
          else
            pnpm exec turbo run lint typecheck build --filter=web
          fi

  # The 10 e2e suites (7 apps/api, 3 apps/event-processor) have never run in CI before this —
  # they live under test/, outside turbo's rootDir, behind a separate test:e2e script no task
  # references. This is the highest-value job in the whole plan: these are the tests that
  # actually exercise Postgres + RabbitMQ + Elasticsearch together, not mocks.
  e2e:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Plain values, not secrets — local-infra credentials with nothing confidential about
      # them, matching docker-compose.yml exactly. Secrets that aren't secret make the real
      # ones (Step 5's Deploy Hooks) harder to spot later.
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: splitlab
      DB_PASSWORD: splitlab
      DB_NAME: splitlab_test
      RABBITMQ_URL: amqp://splitlab:splitlab@localhost:5672
      RABBITMQ_QUEUE: events_test
      ELASTICSEARCH_URL: http://localhost:9200
      ELASTICSEARCH_INDEX_PREFIX: splitlab-test
      # getOrThrow at boot (webhook.config.ts) — nothing here calls out to a real webhook, but
      # the config key must exist. example.invalid is RFC 2606-reserved, guaranteed to never
      # resolve, matching docker-compose.yml's own placeholder.
      RESULTS_WEBHOOK_URL: https://example.invalid/webhook
      RESULTS_WEBHOOK_SECRET: ci-test-secret
      RESULTS_WEBHOOK_TIMEOUT_MS: "5000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitlab
          POSTGRES_PASSWORD: splitlab
          POSTGRES_DB: splitlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitlab -d splitlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: splitlab
          RABBITMQ_DEFAULT_PASS: splitlab
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: elasticsearch:9.5.1
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.ml.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # services: has no volumes: — the compose file's uuid-ossp + splitlab_test bootstrap
      # (docker/init-test-db.sql) can't be mounted here, so it runs as an explicit step
      # instead, against the default `splitlab` database psql connects to before
      # `splitlab_test` even exists. Same file as compose uses — cannot drift out of sync.
      - name: Bootstrap uuid-ossp + splitlab_test
        run: psql "postgresql://splitlab:splitlab@localhost:5432/splitlab" -f docker/init-test-db.sql
        env:
          PGPASSWORD: splitlab

      # events-contract isn't a turbo task in this job (test:e2e is invoked directly, not
      # through turbo — V6/V7), and this is a fresh runner with no artifacts from other jobs,
      # so its dist/ build has to happen explicitly before anything imports it.
      - name: Build events-contract
        run: pnpm --filter @split-lab/events-contract build

      - name: Apply migrations to splitlab_test
        run: pnpm --filter @split-lab/api migration:run:test

      # Destructive-but-idempotent against a database that was empty seconds ago — safe here.
      - name: Build search indices
        run: pnpm --filter @split-lab/api search:reindex:test

      - name: apps/api e2e
        run: pnpm --filter @split-lab/api test:e2e

      - name: apps/event-processor e2e
        run: pnpm --filter @split-lab/event-processor test:e2e

  # The single thing anything downstream (branch protection if it's ever added back, Step 5's
  # deploy job today) should depend on. needs: every job above, if: always() so it still runs
  # even when one of them failed, and it fails itself if any dependency's result was
  # "failure" or "cancelled" — "skipped" is fine, that's the whole point of the path filters.
  ci-ok:
    needs: [changes, backend, web, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.backend.result }}" = "cancelled" ]; then
            echo "backend job: ${{ needs.backend.result }}"
            exit 1
          fi
          if [ "${{ needs.web.result }}" = "failure" ] || [ "${{ needs.web.result }}" = "cancelled" ]; then
            echo "web job: ${{ needs.web.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" = "failure" ] || [ "${{ needs.e2e.result }}" = "cancelled" ]; then
            echo "e2e job: ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "all gates passed or were correctly skipped"

  # Render's Auto-Deploy used to fire on every push to main, completely decoupled from CI —
  # this job replaces that wire. push-only (a PR must never deploy), gated on ci-ok, so a push
  # with a failing test produces no new Render deploy on any of the three services. No path
  # filter here — a deploy always considers all three, since a Render dashboard sanity check
  # costs a couple of minutes on a free tier and "deploy only what changed" is real added
  # complexity for no real savings at this scale.
  #
  # The three Deploy Hook URLs ARE secrets — anyone holding one can trigger a deploy of that
  # service on demand — unlike the e2e job's plain env: values, which are non-confidential
  # local-infra credentials. Read into env: from secrets, curl'd via the shell variable, never
  # string-interpolated directly into the run: command, so GitHub's log-masking definitely
  # catches it. -f makes curl fail the step on a non-2xx response instead of swallowing an
  # error page as success.
  deploy:
    needs: [ci-ok]
    # A custom `if:` on a job with `needs:` DROPS the implicit success() check GitHub applies
    # by default — needs.ci-ok.result == 'success' has to be written explicitly, or this job
    # runs on every push regardless of whether ci-ok actually passed. Confirmed the hard way:
    # a live red-then-green test showed "skipped" both times by coincidence (a genuinely
    # failed dependency still short-circuits things some other way) — this line is what
    # actually makes it safe on purpose rather than by luck.
    if: github.event_name == 'push' && needs.ci-ok.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy api
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: curl -f -X POST "$HOOK_URL"

      - name: Deploy event-processor
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_EVENTS }}
        run: curl -f -X POST "$HOOK_URL"

      - name: Deploy web
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: curl -f -X POST "$HOOK_URL"

  # Real post-deploy smoke test — not a disposable copy of the stack, the actual live one.
  # golden-path.spec.ts already reads STACK_BASE_URL with no localhost fallback (built for the
  # isolated splitlab-e2e compose network, M13) — the same property that made it safe there
  # makes it equally usable against a live target, unmodified. No services: block, no infra to
  # stand up — this is a plain Jest suite making HTTP requests against endpoints that are
  # already live, which is also why it's cheap enough to run on every push, not just a
  # schedule (deliberately rejected — see ci.md once it exists).
  #
  # Same if: pitfall as `deploy` above — needs.deploy.result == 'success' has to be explicit.
  smoke:
    needs: [deploy]
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STACK_BASE_URL: https://split-lab.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deploy lag is real and unverified as of writing this — a Deploy Hook POST isn't
      # instantaneous, so the first request here could hit a still-booting instance. If this
      # step turns out flaky for that reason, add a short bounded retry against GET /health
      # before the suite proper — not a blind sleep, measure the actual lag first.
      - name: Golden-path smoke test against live Render
        run: pnpm --filter stack-e2e e2e

      # On red: this job going red IS the alarm (no automated rollback, by design — see D10 in
      # the M14 plan). The human response is checking this log, then Render's dashboard
      # "Rollback" button on whichever service looks broken. Nothing here does that
      # automatically, on purpose.
