name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for turbo's --filter=...[base] to diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-

      # Full run on push to main; PRs narrow to packages affected since the base branch.
      # A task a package doesn't define is skipped, not failed.
      - name: Lint, typecheck, test, build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo run lint typecheck test build --filter="...[origin/${{ github.base_ref }}]"
          else
            npx turbo run lint typecheck test build
          fi
